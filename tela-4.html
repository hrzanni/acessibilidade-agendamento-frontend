<!DOCTYPE html>

<head>

</head>
<body>
<main class="cartao t4">
<p class="etapa">Etapa 2 de 5</p>
<ol class="barras" aria-hidden="true"><li class="feito"></li><li class="atual"></li><li class=""></li><li class=""></li><li class=""></li></ol>

<h1 class="etapa-titulo">Onde você quer ser atendido?</h1>
<label class="rotulo" for="local">Bairro, CEP ou endereço</label>
<input class="campo" id="local" type="text" placeholder="Exemplo: Centro, Rio de Janeiro">
<button type="button" class="btn btn-sec">Usar minha localização</button>
<div class="acoes"><button type="button" class="btn btn-voltar">Voltar</button><button type="button" class="btn btn-prim">Continuar</button></div>
