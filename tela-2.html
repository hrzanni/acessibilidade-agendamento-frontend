<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escolha o horário</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="cartao t2">
<p class="etapa">Etapa 4 de 5</p>
<ol class="barras" aria-hidden="true"><li class="feito"></li><li class="feito"></li><li class="feito"></li><li class="atual"></li><li class=""></li></ol>
<ol class="nomes"><li class="feito"><span class="ok" aria-hidden="true">✓</span> Especialidade</li><li class="feito"><span class="ok" aria-hidden="true">✓</span> Local</li><li class="feito"><span class="ok" aria-hidden="true">✓</span> Dia</li><li class="atual" aria-current="step">Horário</li><li>Confirmar</li></ol>
<h1 class="etapa-titulo">Escolha o horário</h1>
<p class="sub">Clínica de exemplo · quinta-feira, 5 de novembro</p>
<h2 class="periodo">Manhã</h2>
<ul class="horas"><li><button type="button" aria-pressed="false">08:30</button></li><li><button type="button" aria-pressed="true"><span aria-hidden="true">✓</span> 09:30</button></li><li><button type="button" aria-pressed="false">10:00</button></li></ul>
<h2 class="periodo tarde">Tarde</h2>
<ul class="horas h2"><li><button type="button" aria-pressed="false">15:15</button></li><li><button type="button" aria-pressed="false">15:30</button></li><li><button type="button" aria-pressed="false">16:00</button></li></ul>
<button type="button" class="btn btn-sec btn-mais">Ver mais horários da tarde</button>
<p class="aviso">Aviso: sábado 7 e domingo 8 não têm atendimento nesta clínica.</p>
<button type="button" class="btn btn-prim">Continuar</button>
</main>
</body>
</html>
